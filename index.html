<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SIMMA · MI. Miftahul Ulum Semampir</title>
    <meta name="description" content="Sistem Informasi Manajemen Madrasah MI. Miftahul Ulum Semampir" />
    <meta name="theme-color" content="#14532D" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIMMA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Sambungkan lebih awal ke server Firebase & Apps Script agar panggilan pertama lebih cepat -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <style>
      /* Layar muat awal: tampil sebelum JavaScript siap, mencegah layar putih. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #F6F8F7; font-family: system-ui, sans-serif; color: #14532D; }
      #boot b { font-size: 22px; letter-spacing: .02em; }
      #boot i { display: block; width: 120px; height: 3px; margin: 14px auto 0; background: linear-gradient(90deg, #14532D 0 40%, #E8F3EC 40%); background-size: 200% 100%; animation: bt 1s linear infinite; border-radius: 3px; }
      @keyframes bt { from { background-position: 100% 0 } to { background-position: -100% 0 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div style="text-align:center"><b>SIMMA</b><i></i></div></div></div>
    <noscript>Aktifkan JavaScript untuk memakai SIMMA.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

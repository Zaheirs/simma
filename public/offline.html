<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · SIMMA</title>
<meta name="theme-color" content="#14532D">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F8F7; color: #0F172A; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 32px 24px; max-width: 380px; text-align: center; }
  svg { width: 56px; height: 56px; color: #14532D; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #475569; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; background: #166534; color: #fff; border: 0; border-radius: 4px; min-height: 48px; padding: 0 24px; cursor: pointer; width: 100%; }
  button:focus-visible { outline: 2px solid #14532D; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    <h1>Anda sedang offline</h1>
    <p>Sambungkan internet untuk melanjutkan. Data pribadi tidak disimpan di perangkat demi keamanan.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
